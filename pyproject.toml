[project]
name = "familylens"
version = "0.1.0"
description = "FamilyLens is a local-first intelligent photo search application that allows users to search their personal photo library using natural language queries."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.1",
    "pillow>=12.1.1",
    "pydantic-settings>=2.13.1",
    "qdrant-client>=1.12.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
