[project]
name = "familylens"
version = "0.1.0"
description = "FamilyLens is a local-first intelligent photo search application that allows users to search their personal photo library using natural language queries."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pillow>=11.0.0",
    "pydantic-settings>=2.6.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.3.0",
    "torch>=2.4.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
