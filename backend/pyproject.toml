[project]
name = "familylens"
version = "0.2.0"
description = "FamilyLens is a local-first intelligent photo search application that allows users to search their personal photo library using natural language queries."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.3.0",
    "pillow>=11.0.0",
    "pydantic-settings>=2.6.0",
    "qdrant-client>=1.12.0",
    "rawpy>=0.24.0",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=3.3.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
exclude-newer = "7 days"

# Linux (the Docker image) uses CPU-only PyTorch wheels, which avoids
# pulling several GB of CUDA libraries. macOS wheels from PyPI are already
# CPU/MPS builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true