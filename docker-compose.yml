services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    # Not published to the host: only the api service talks to Qdrant.
    # For debugging, add: ports: ["127.0.0.1:6333:6333"]
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      # Bound to localhost only. The API has no authentication.
      - "127.0.0.1:8000:8000"
    volumes:
      - ${PHOTOS_DIR:-./data/photos}:/photos/1:ro
      - ${PHOTOS_DIR_2:-./data/photos_2}:/photos/2:ro
      - ${PHOTOS_DIR_3:-./data/photos_3}:/photos/3:ro
      - ${PHOTOS_DIR_4:-./data/photos_4}:/photos/4:ro
      - ${PHOTOS_DIR_5:-./data/photos_5}:/photos/5:ro
    environment:
      - FAMILYLENS_QDRANT_HOST=qdrant
      - FAMILYLENS_QDRANT_PORT=6333
      - FAMILYLENS_PHOTOS_DIR=/photos
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  qdrant_storage:
